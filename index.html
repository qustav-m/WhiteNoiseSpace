<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>White Noise Space</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    input[type=range] { accent-color: #fff; background: transparent; }
    input[type=range] { -webkit-appearance: none; }
    input[type=range]::-webkit-slider-runnable-track { -webkit-appearance: none; background: #555; height: 2px; border-radius: 1px; }
    input[type=range]::-webkit-slider-thumb { background: #fff; width: 12px; height: 12px; border-radius: 50%; margin-top: -5px; -webkit-appearance: none; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 13px monospace;
      opacity: 0.8;
      pointer-events: none;
      white-space: pre;
      text-align: center;
    }
    #ui {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 6px;
      padding: 16px;
      background: #000;
      font: 12px monospace;
      color: #fff;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <video id="webcam" autoplay muted playsinline style="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;"></video>
  <canvas id="canvas"></canvas>
  <div id="status">Loading...</div>
  <div id="ui">
    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <button id="btn-mute" style="background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 8px;cursor:pointer;">unmute</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;">
      <label for="slider-bpm"><span id="bpm-label">30</span> bpm</label>
      <input id="slider-bpm" type="range" min="10" max="180" value="30" step="1" style="width:100px">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:70px;">noise</span>
        <label for="input-noise-w">w</label>
        <input id="input-noise-w" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
        <label for="input-noise-h">h</label>
        <input id="input-noise-h" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:70px;">pbr</span>
        <label for="input-pbr-w">w</label>
        <input id="input-pbr-w" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
        <label for="input-pbr-h">h</label>
        <input id="input-pbr-h" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:70px;">grid</span>
        <label for="input-grid-w">w</label>
        <input id="input-grid-w" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
        <label for="input-grid-h">h</label>
        <input id="input-grid-h" type="number" min="1" style="width:55px;background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 5px;">
      </div>
      <button id="btn-copy-noise-to-grid" style="background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 8px;cursor:pointer;">copy noise → grid</button>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
