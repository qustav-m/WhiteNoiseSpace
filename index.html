<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Window</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 13px monospace;
      opacity: 0.8;
      pointer-events: none;
      white-space: pre;
      text-align: center;
    }
    #ui {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font: 12px monospace;
      color: #fff;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <video id="webcam" autoplay muted playsinline style="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;"></video>
  <canvas id="canvas"></canvas>
  <div id="status">Loading...</div>
  <div id="ui">
    <button id="btn-mute" style="background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 8px;cursor:pointer;">unmute</button>
    <button id="btn-mode" style="background:#fff;border:1px solid #000;color:#000;font:12px monospace;padding:2px 8px;cursor:pointer;">reveal</button>
    <label for="slider-bpm">bpm</label>
    <input id="slider-bpm" type="range" min="10" max="180" value="30" step="1" style="width:100px">
    <span id="bpm-label" style="background:#fff;border:1px solid #000;color:#000;padding:2px 5px;">30</span>
    <label for="slider-res">res</label>
    <input id="slider-res" type="range" min="5" max="100" value="100" step="1" style="width:140px">
    <span id="res-label" style="background:#fff;border:1px solid #000;color:#000;padding:2px 5px;">100%</span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
